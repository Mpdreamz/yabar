name: docs

# The docs (docs-builder) with the landing page over their home page, published to GitHub Pages at
# https://mpdreamz.github.io/yabar/. scripts/docs.sh builds the same thing locally (mise run docs).
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  docs:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v5

      - name: Build documentation
        uses: elastic/docs-builder@main
        with:
          prefix: yabar

      # Same overrides as scripts/docs.sh, in the same order.
      - name: Use the landing page
        run: |
          cp docs/yabar-landing.html .artifacts/docs/html/index.html
          cp docs/robots.txt .artifacts/docs/html/robots.txt
          cp install.sh .artifacts/docs/html/install.sh

      - name: Setup Pages
        uses: actions/configure-pages@v6.0.0

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: .artifacts/docs/html

      - name: Deploy artifact
        id: deployment
        uses: actions/deploy-pages@v4
